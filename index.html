<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblio+ · Bibliothèque municipale</title>
    <meta name="description" content="Biblio+ : consultez le catalogue de la bibliothèque municipale, recherchez un livre et vérifiez sa disponibilité avant de venir.">
    <script>
      (function () {
        try {
          var t = localStorage.getItem('biblio-plus:theme')
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
